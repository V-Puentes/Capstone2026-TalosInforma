<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Talos — Hub de contingencia nacional</title>
<style>
  :root{
    --bg:#f1f2f4; --card:#ffffff; --ink:#0f172a; --sub:#475569; --line:#cbd5e1;
    --header:#0f172a; --header2:#1e293b;
    --left:#2f5d8c; --center:#8a9199; --right:#b0472f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .serif{font-family:"Georgia","Iowan Old Style",serif;}
  a,button{font-family:inherit;}
  button{cursor:pointer;}

  header.top{background:var(--header);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .barA{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;}
  .logo{display:flex;align-items:center;gap:8px;color:#fff;background:none;border:0;font-size:19px;}
  .logo svg{width:22px;height:22px;}
  nav.tabs{display:flex;gap:4px;}
  nav.tabs button{background:none;border:0;color:#cbd5e1;padding:6px 12px;border-radius:6px;font-size:14px;display:flex;align-items:center;gap:6px;}
  nav.tabs button.active{background:rgba(255,255,255,.14);color:#fff;}
  .disclaimer{background:var(--header2);border-top:1px solid rgba(255,255,255,.08);}
  .disclaimer p{max-width:1080px;margin:0 auto;padding:8px 16px;font-size:12.5px;line-height:1.5;color:#cbd5e1;display:flex;gap:8px;}
  .disclaimer svg{flex:none;margin-top:2px;width:14px;height:14px;}

  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--sub);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .carousel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .carousel-head h2{font-size:13.5px;font-weight:600;margin:0;color:#1e293b;}
  .carousel-nav{display:flex;gap:4px;}
  .carousel-nav button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;}
  .carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:22px;}
  .ccard{flex:none;width:230px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;}
  .ccard p{font-size:13.5px;font-weight:500;margin:0 0 8px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:680px){.grid{grid-template-columns:1fr 1fr;}}

  .event{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:left;transition:border-color .15s;}
  .event:hover{border-color:#64748b;}
  .meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:#64748b;margin-bottom:8px;flex-wrap:wrap;}
  .badge{background:#f1f5f9;color:#334155;padding:2px 8px;border-radius:4px;font-weight:500;}
  .meta .push{margin-left:auto;}
  .icon-inline{display:inline-flex;align-items:center;gap:4px;}
  .event h3{font-size:17px;line-height:1.35;margin:0 0 12px;font-weight:600;}

  .biasbar{display:flex;width:100%;height:10px;border-radius:2px;overflow:hidden;}
  .biasbar.sm{height:6px;}
  .biasbar.lg{height:12px;}
  .bias-legend{display:flex;justify-content:space-between;font-size:11.5px;color:#475569;margin-top:6px;}
  .bias-legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .empty{border:1px dashed #94a3b8;border-radius:8px;padding:26px;text-align:center;font-size:13.5px;color:#475569;}

  /* Detail */
  .backlink{display:flex;align-items:center;gap:6px;background:none;border:0;color:#475569;font-size:13.5px;margin-bottom:18px;}
  .backlink:hover{color:var(--ink);}
  .detail-head h1{font-size:24px;line-height:1.3;margin:12px 0 16px;font-weight:600;}
  .cols{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0;}
  @media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr);}}
  .col{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:4px solid;}
  .col-head h3{margin:0;font-size:15px;font-weight:600;}
  .col-head span{font-size:11.5px;color:#475569;display:flex;align-items:center;gap:4px;}
  .col-body{padding:14px;}
  .label{font-size:11.5px;color:#64748b;margin:0 0 4px;}
  .tono{font-size:14px;font-weight:500;margin:0 0 8px;}
  .meter{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#cbd5e1,#e2e8f0,#cbd5e1);margin-bottom:4px;}
  .meter i{position:absolute;top:50%;width:4px;height:14px;background:var(--ink);transform:translateY(-50%);border-radius:2px;}
  .meter-labels{display:flex;justify-content:space-between;font-size:10.5px;color:#94a3b8;margin-bottom:14px;}
  ul.bullets{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:#1e293b;}
  ul.bullets li{margin-bottom:6px;}

  .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .tabbar button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px;font-size:13.5px;color:#64748b;}
  .tabbar button.active{color:var(--ink);font-weight:600;}
  @media(min-width:900px){.tabbar{display:none;}}
  @media(max-width:899px){ .cols .col{display:none;} .cols .col.show{display:block;} }

  .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;}
  .panel h2{font-size:14px;margin:0 0 2px;font-weight:600;}
  .panel .hint{font-size:12px;color:#64748b;margin:0 0 14px;}
  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{display:grid;grid-template-columns:80px 1fr 40px;align-items:center;gap:10px;font-size:13px;}
  .row .track{height:14px;background:#eef2f7;border-radius:3px;overflow:hidden;}
  .row .fill{height:100%;border-radius:3px;}

  .stats-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px;}
  @media(min-width:900px){.stats-grid{grid-template-columns:3fr 2fr;}}

  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;}
  svg.donut{width:170px;height:170px;}
  .donut-legend{font-size:13px;display:flex;flex-direction:column;gap:8px;}
  .donut-legend span{display:flex;align-items:center;gap:8px;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f16; --card:#141a24; --ink:#e6e9ef; --sub:#9aa5b1; --line:#28323f;
      --header:#05070a; --header2:#0d131c;
    }
    :root:not([data-theme="light"]) .badge{background:#1c2531;color:#c7d0db;}
    :root:not([data-theme="light"]) .ccard{background:#101620;}
    :root:not([data-theme="light"]) .chip{background:var(--card);}
    :root:not([data-theme="light"]) .row .track,
    :root:not([data-theme="light"]) .meter{background:#1c2531;}
  }
  :root[data-theme="dark"]{
    --bg:#0b0f16; --card:#141a24; --ink:#e6e9ef; --sub:#9aa5b1; --line:#28323f;
    --header:#05070a; --header2:#0d131c;
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap barA">
    <button class="logo" onclick="setView('home')" aria-label="Ir al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 7l-3 7a4 4 0 0 0 8 0l-3-7M19 7l-3 7a4 4 0 0 0 8 0l-3-7M6 7h4M16 7h4"/></svg>
      Talos
    </button>
    <nav class="tabs">
      <button id="nav-home" onclick="setView('home')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Eventos</button>
      <button id="nav-stats" onclick="setView('stats')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>Estadísticas</button>
    </nav>
  </div>
  <div class="disclaimer">
    <p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    Talos es una herramienta analítica: mide cómo cada línea editorial cubre un mismo hecho. No califica la veracidad de las noticias ni recomienda medios. Prototipo con datos simulados.</p>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const COLORS={left:"#2f5d8c",center:"#8a9199",right:"#b0472f"};
const LABELS={left:"Izquierda",center:"Centro",right:"Derecha"};
const CATEGORIAS=["Todas","Política","Economía","Seguridad","Sociedad"];

const EVENTOS=[
{id:1,titulo_neutro:"Discusión legislativa sobre la reforma de pensiones",categoria:"Economía",fecha:"2026-09-24",destacado:true,
 bias:{left:45,center:20,right:35},subjetividad:{left:68,center:31,right:62},n_articulos:27,
 analisis:{
  left:{tono:"Crítico hacia el sistema privado",tono_score:-0.42,resumen:["Enfatiza el impacto en las pensiones de mujeres y de la clase media.","Cuestiona el rol de las administradoras privadas.","Destaca el aporte estatal como condición para la viabilidad."]},
  center:{tono:"Descriptivo y procedimental",tono_score:0.05,resumen:["Detalla el calendario de votación y los quórums requeridos.","Presenta cifras de cotización y costo fiscal sin valorarlas.","Recoge posiciones de ambos bloques con extensión similar."]},
  right:{tono:"Cauteloso ante el costo fiscal",tono_score:-0.18,resumen:["Advierte sobre el efecto en el empleo formal y el gasto público.","Defiende la propiedad de los fondos individuales.","Propone gradualidad y mayor competencia entre administradoras."]}
 }},
{id:2,titulo_neutro:"Operativo policial en la zona sur del país",categoria:"Seguridad",fecha:"2026-09-22",destacado:true,
 bias:{left:22,center:28,right:50},subjetividad:{left:59,center:27,right:71},n_articulos:19,
 analisis:{
  left:{tono:"Preocupación por derechos y proporcionalidad",tono_score:-0.51,resumen:["Pone el foco en comunidades afectadas y denuncias de exceso de fuerza.","Pide contexto histórico y salidas políticas al conflicto.","Cita organizaciones de derechos humanos como fuente principal."]},
  center:{tono:"Factual, basado en comunicados",tono_score:-0.04,resumen:["Reproduce partes oficiales y declaraciones de las autoridades.","Informa número de detenidos y decomisos.","Incluye una reacción de la contraparte sin comentario editorial."]},
  right:{tono:"Respaldo a la acción policial",tono_score:0.33,resumen:["Presenta el operativo como restitución del orden público.","Subraya el daño a víctimas civiles y a la propiedad.","Exige mayor dotación y respaldo jurídico a las policías."]}
 }},
{id:3,titulo_neutro:"Debate presupuestario para salud y educación 2027",categoria:"Política",fecha:"2026-09-19",destacado:false,
 bias:{left:38,center:41,right:21},subjetividad:{left:55,center:24,right:49},n_articulos:14,
 analisis:{
  left:{tono:"Favorable a mayor gasto social",tono_score:0.27,resumen:["Valora el aumento propuesto para la atención primaria.","Reclama que el reajuste no cubre listas de espera.","Contrasta la propuesta con demandas de gremios."]},
  center:{tono:"Informativo, orientado a cifras",tono_score:0.02,resumen:["Compara asignaciones respecto del año anterior.","Explica los plazos de tramitación en comisión mixta.","Sintetiza posiciones de la oposición y del oficialismo."]},
  right:{tono:"Escéptico sobre eficiencia del gasto",tono_score:-0.22,resumen:["Pide evaluación de resultados antes de ampliar recursos.","Cuestiona la sostenibilidad de compromisos permanentes.","Sugiere priorizar inversión y gestión hospitalaria."]}
 }},
{id:4,titulo_neutro:"Alza en el precio de los combustibles esta semana",categoria:"Economía",fecha:"2026-09-17",destacado:true,
 bias:{left:30,center:44,right:26},subjetividad:{left:47,center:21,right:44},n_articulos:22,
 analisis:{
  left:{tono:"Alerta por efecto en hogares",tono_score:-0.36,resumen:["Vincula el alza con el costo del transporte y los alimentos.","Cuestiona el mecanismo de estabilización de precios.","Pide subsidios focalizados."]},
  center:{tono:"Neutro y explicativo",tono_score:0.0,resumen:["Explica la relación con el precio internacional del crudo.","Entrega la variación por tipo de combustible.","Resume el calendario de ajustes semanales."]},
  right:{tono:"Énfasis en factores de mercado",tono_score:-0.1,resumen:["Atribuye el alza a la volatilidad externa y al tipo de cambio.","Rechaza controles de precios como respuesta.","Sugiere revisar la carga tributaria específica."]}
 }}
];

const MEDIOS=[
 {medio:"Diario Austral",orientacion:"left",subjetividad:66},
 {medio:"La Crónica Sur",orientacion:"left",subjetividad:58},
 {medio:"Noticiero Central",orientacion:"center",subjetividad:26},
 {medio:"Agencia Nacional",orientacion:"center",subjetividad:19},
 {medio:"El Observador",orientacion:"right",subjetividad:61},
 {medio:"Mercurio Andino",orientacion:"right",subjetividad:54}
];

let state={view:"home",categoria:"Todas",selectedId:null,tab:"left"};

function fmtFecha(iso){
  return new Date(iso+"T12:00:00").toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"numeric"});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function biasBar(bias,{size="",legend=false}={}){
  const segs=["left","center","right"].map(k=>`<div style="width:${bias[k]}%;background:${COLORS[k]}"></div>`).join("");
  let html=`<div class="biasbar ${size}" role="img" aria-label="Cobertura izquierda ${bias.left}%, centro ${bias.center}%, derecha ${bias.right}%">${segs}</div>`;
  if(legend){
    html+=`<div class="bias-legend">${["left","center","right"].map(k=>
      `<span><span class="dot" style="background:${COLORS[k]}"></span>${LABELS[k]} ${bias[k]}%</span>`).join("")}</div>`;
  }
  return html;
}

function eventCard(e){
  return `<button class="event" onclick="openDetail(${e.id})">
    <div class="meta">
      <span class="badge">${esc(e.categoria)}</span>
      <span class="icon-inline"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${fmtFecha(e.fecha)}</span>
      <span class="icon-inline push"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v5h5"/></svg>${e.n_articulos} artículos</span>
    </div>
    <h3 class="serif">${esc(e.titulo_neutro)}</h3>
    ${biasBar(e.bias,{legend:true})}
  </button>`;
}

function renderHome(){
  const destacados=EVENTOS.filter(e=>e.destacado && (state.categoria==="Todas"||e.categoria===state.categoria));
  const filtrados=EVENTOS.filter(e=>state.categoria==="Todas"||e.categoria===state.categoria);

  const chips=CATEGORIAS.map(c=>`<button class="chip ${c===state.categoria?"active":""}" onclick="setCategoria('${c}')">${c}</button>`).join("");

  const carousel=destacados.length?`
    <div class="carousel-head">
      <h2>Hechos destacados</h2>
      <div class="carousel-nav">
        <button onclick="scrollCarousel(-1)" aria-label="Anterior"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button onclick="scrollCarousel(1)" aria-label="Siguiente"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
    <div class="carousel" id="carousel">
      ${destacados.map(e=>`<button class="ccard" onclick="openDetail(${e.id})">
        <p>${esc(e.titulo_neutro)}</p>${biasBar(e.bias,{size:"sm"})}
      </button>`).join("")}
    </div>`:"";

  const cards=filtrados.length
    ? `<div class="grid">${filtrados.map(eventCard).join("")}</div>`
    : `<p class="empty">No hay eventos en esta categoría. Elige otra para ver más cobertura.</p>`;

  return `<div class="chips" role="tablist">${chips}</div>${carousel}${cards}`;
}

function toneMeter(score){
  const pos=((score+1)/2)*100;
  return `<div class="meter"><i style="left:calc(${pos}% - 2px)"></i></div>
  <div class="meter-labels"><span>Negativo</span><span>Neutro</span><span>Positivo</span></div>`;
}

function column(k,data,subj,visibleClass){
  return `<article class="col ${visibleClass}" style="border-bottom-color:${COLORS[k]}">
    <div class="col-head" style="border-color:${COLORS[k]}">
      <h3>Cobertura ${LABELS[k].toLowerCase()}</h3>
      <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20a8 8 0 1 0-8-8"/><path d="M12 12l4-4"/></svg>Subjetividad ${subj}%</span>
    </div>
    <div class="col-body">
      <p class="label">Tono predominante</p>
      <p class="tono">${esc(data.tono)}</p>
      ${toneMeter(data.tono_score)}
      <p class="label">Resumen generado por NLP</p>
      <ul class="bullets">${data.resumen.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
    </div>
  </article>`;
}

function renderDetail(){
  const e=EVENTOS.find(x=>x.id===state.selectedId);
  if(!e) return `<p class="empty">Evento no encontrado.</p>`;
  const tabbar=`<div class="tabbar">${["left","center","right"].map(k=>
    `<button class="${state.tab===k?"active":""}" style="${state.tab===k?`border-bottom-color:${COLORS[k]}`:""}" onclick="setTab('${k}')">${LABELS[k]}</button>`).join("")}</div>`;
  const cols=`<div class="cols">${["left","center","right"].map(k=>
    column(k,e.analisis[k],e.subjetividad[k], state.tab===k?"show":"")).join("")}</div>`;

  const maxSubj=100;
  const subjRows=["left","center","right"].map(k=>`
    <div class="row"><span>${LABELS[k]}</span>
      <div class="track"><div class="fill" style="width:${e.subjetividad[k]}%;background:${COLORS[k]}"></div></div>
      <span>${e.subjetividad[k]}%</span>
    </div>`).join("");

  return `
    <button class="backlink" onclick="setView('home')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al feed
    </button>
    <div class="detail-head">
      <div class="meta">
        <span class="badge">${esc(e.categoria)}</span>
        <span>${fmtFecha(e.fecha)}</span>
        <span>${e.n_articulos} artículos agrupados</span>
      </div>
      <h1 class="serif">${esc(e.titulo_neutro)}</h1>
      <div style="max-width:480px">${biasBar(e.bias,{size:"lg",legend:true})}</div>
    </div>
    ${tabbar}
    ${cols}
    <section class="panel">
      <h2>Índice de subjetividad por orientación</h2>
      <p class="hint">0% = lenguaje factual · 100% = lenguaje altamente valorativo (dato simulado)</p>
      <div class="rows">${subjRows}</div>
    </section>
  `;
}

function donutSVG(global){
  const r=70,cx=85,cy=85,circ=2*Math.PI*r;
  let offset=0;
  const arcs=global.map(g=>{
    const len=circ*(g.value/100);
    const dash=`${len} ${circ-len}`;
    const rot=(offset/circ)*360;
    offset+=len;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COLORS[g.k]}" stroke-width="26"
      stroke-dasharray="${dash}" transform="rotate(${rot-90} ${cx} ${cy})"/>`;
  }).join("");
  return `<svg class="donut" viewBox="0 0 170 170">${arcs}</svg>`;
}

function renderStats(){
  const avg=k=>Math.round(EVENTOS.reduce((s,e)=>s+e.bias[k],0)/EVENTOS.length);
  const global=["left","center","right"].map(k=>({k,name:LABELS[k],value:avg(k)}));

  const bars=MEDIOS.map(m=>`
    <div class="row">
      <span style="font-size:12px">${esc(m.medio)}</span>
      <div class="track"><div class="fill" style="width:${m.subjetividad}%;background:${COLORS[m.orientacion]}"></div></div>
      <span>${m.subjetividad}%</span>
    </div>`).join("");

  return `
    <h1 class="serif" style="font-size:24px;margin:0 0 4px">Estadísticas por medio</h1>
    <p style="font-size:13.5px;color:var(--sub);margin:0 0 4px">Vista simulada con medios ficticios para ilustrar el concepto.</p>
    <div class="stats-grid">
      <section class="panel">
        <h2>Subjetividad promedio por medio</h2>
        <p class="hint">Dato simulado, 0–100%</p>
        <div class="rows">${bars}</div>
      </section>
      <section class="panel">
        <h2>Distribución global de cobertura</h2>
        <p class="hint">Promedio de los eventos registrados</p>
        <div class="donut-wrap">
          ${donutSVG(global)}
          <div class="donut-legend">${global.map(g=>`<span><span class="dot" style="background:${COLORS[g.k]}"></span>${g.name} — ${g.value}%</span>`).join("")}</div>
        </div>
      </section>
    </div>
  `;
}

function render(){
  const app=document.getElementById("app");
  if(state.view==="home") app.innerHTML=renderHome();
  else if(state.view==="detail") app.innerHTML=renderDetail();
  else app.innerHTML=renderStats();

  document.getElementById("nav-home").classList.toggle("active", state.view==="home"||state.view==="detail");
  document.getElementById("nav-stats").classList.toggle("active", state.view==="stats");
  window.scrollTo({top:0,behavior:"instant" in window ? "instant":"auto"});
}

function setView(v){ state.view=v; if(v!=="detail") state.selectedId=null; render(); }
function setCategoria(c){ state.categoria=c; render(); }
function openDetail(id){ state.selectedId=id; state.tab="left"; state.view="detail"; render(); }
function setTab(k){ state.tab=k; render(); }
function scrollCarousel(dir){
  const el=document.getElementById("carousel");
  if(el) el.scrollBy({left:dir*250,behavior:"smooth"});
}

render();
</script>
</body>
</html>
